<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Setup Check</title>
    <link rel="stylesheet" href="styles/sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Setup Check</h1>
      <p class="sub">Four things that break a meeting. Measured live, locally.</p>
    </header>

    <!-- One shell per integration. The body is filled by its module. -->
    <section class="row" data-key="network">
      <button class="row-head" aria-expanded="true" aria-controls="body-network">
        <span class="row-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 8.8a16 16 0 0 1 20 0" />
            <path d="M5.5 12.3a11 11 0 0 1 13 0" />
            <path d="M9 15.8a6 6 0 0 1 6 0" />
            <circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span class="row-title">Network</span>
        <span class="row-status" data-status>starting</span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
        </span>
      </button>
      <div class="row-body" id="body-network"><div class="row-body-inner" data-mount></div></div>
    </section>

    <section class="row" data-key="audio">
      <button class="row-head" aria-expanded="true" aria-controls="body-audio">
        <span class="row-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2.5" width="6" height="11" rx="3" />
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
            <path d="M12 18v3.5" />
          </svg>
        </span>
        <span class="row-title">Microphone</span>
        <span class="row-status" data-status>starting</span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
        </span>
      </button>
      <div class="row-body" id="body-audio"><div class="row-body-inner" data-mount></div></div>
    </section>

    <section class="row" data-key="camera">
      <button class="row-head" aria-expanded="false" aria-controls="body-camera">
        <span class="row-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="6.5" width="13" height="11" rx="2.5" />
            <path d="M15.5 11.5 21.5 8v8l-6-3.5z" />
          </svg>
        </span>
        <span class="row-title">Camera</span>
        <span class="row-status" data-status>idle</span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
        </span>
      </button>
      <div class="row-body" id="body-camera"><div class="row-body-inner" data-mount></div></div>
    </section>

    <section class="row" data-key="memory">
      <button class="row-head" aria-expanded="false" aria-controls="body-memory">
        <span class="row-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="6" width="12" height="12" rx="2" />
            <path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3" />
          </svg>
        </span>
        <span class="row-title">Memory</span>
        <span class="row-status" data-status>starting</span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
        </span>
      </button>
      <div class="row-body" id="body-memory"><div class="row-body-inner" data-mount></div></div>
    </section>

    <footer>
      <p>Everything runs in this panel. Nothing is recorded or uploaded.</p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
